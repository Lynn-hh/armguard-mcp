[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "armguard-mcp"
dynamic = ["version"]
description = "A safety-first MCP server for ROS 2 manipulators: plan/preview/execute with a server-side safety envelope, human approval and audit log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Lin He (Lynn)", email = "lynnhe02@gmail.com" }]
keywords = ["mcp", "ros2", "robotics", "manipulation", "franka", "safety", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2",
  "pyyaml",
  "anyio>=4",
]

[project.optional-dependencies]
# The ros2 backend needs rclpy, MoveIt 2 and franka_ros2 from a sourced ROS 2 installation
# (apt / colcon). Nothing for it is pip-installable, so this extra is intentionally empty.
ros2 = []
image = ["pillow"]
dev = ["pytest", "anyio", "ruff"]

[project.scripts]
armguard-mcp = "armguard_mcp.cli:main"

[tool.hatch.version]
path = "src/armguard_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/armguard_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: `ruff format` enforces line length for code; long message strings are left intact.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The MCP SDK needs real (non-string) annotations on tools, so no PEP 563 there; keep Optional-free unions.
"src/armguard_mcp/server.py" = ["UP037"]
