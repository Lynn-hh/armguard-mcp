<svg xmlns="http://www.w3.org/2000/svg" width="880" height="544" viewBox="0 0 880 544" role="img" aria-label="armguard-mcp demo: an in-envelope move runs, a large move needs human approval, a keep-out request is rejected and cannot be executed, and the e-stop blocks planning"><style>.l{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;opacity:0;animation:in .25s ease-out forwards}@keyframes in{to{opacity:1}}@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}.l0{animation-delay:0.40s}.l1{animation-delay:0.60s}.l2{animation-delay:1.40s}.l3{animation-delay:2.00s}.l4{animation-delay:2.70s}.l5{animation-delay:3.50s}.l6{animation-delay:3.70s}.l7{animation-delay:4.50s}.l8{animation-delay:5.30s}.l9{animation-delay:5.90s}.l10{animation-delay:6.40s}.l11{animation-delay:6.70s}.l12{animation-delay:7.60s}.l13{animation-delay:8.40s}.l14{animation-delay:8.60s}.l15{animation-delay:9.50s}.l16{animation-delay:10.30s}.l17{animation-delay:11.10s}.l18{animation-delay:12.00s}.l19{animation-delay:12.20s}.l20{animation-delay:13.00s}.l21{animation-delay:13.60s}.l22{animation-delay:14.30s}.l23{animation-delay:15.10s}</style><rect width="880" height="544" rx="8" fill="#0d1117"/><circle cx="20" cy="16" r="5" fill="#ff5f57"/><circle cx="38" cy="16" r="5" fill="#febc2e"/><circle cx="56" cy="16" r="5" fill="#28c840"/><text x="440" y="20" fill="#8a8a8a" text-anchor="middle" style="font:12px ui-monospace,Menlo,monospace">armguard-mcp · simulated FR3 (abridged)</text><text class="l l0" x="18" y="46" fill="#8a8a8a" xml:space="preserve">$ python scripts/demo_fake.py        # an LLM client talking to armguard-mcp</text><text class="l l1" x="18" y="66" fill="#d4d4d4" xml:space="preserve"></text><text class="l l2" x="18" y="86" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; plan_to_pose(x=0.40, y=0.10, z=0.40)</text><text class="l l3" x="18" y="106" fill="#7ee787" xml:space="preserve">    status: "executable"   violations: []</text><text class="l l4" x="18" y="126" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; execute_plan(ecfd2392c028)</text><text class="l l5" x="18" y="146" fill="#7ee787" xml:space="preserve">    status: "completed"    approval: "policy"   (small move, inside the envelope)</text><text class="l l6" x="18" y="166" fill="#d4d4d4" xml:space="preserve"></text><text class="l l7" x="18" y="186" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; plan_to_joints(joint 1 turns -0.9 rad)</text><text class="l l8" x="18" y="206" fill="#e3b341" xml:space="preserve">    status: "needs_approval"   LARGE_MOTION (soft): 0.900 rad &gt; 0.8 rad</text><text class="l l9" x="18" y="226" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; execute_plan(3a6f9dd9e508)</text><text class="l l10" x="18" y="246" fill="#e3b341" xml:space="preserve">    ┌ APPROVE ROBOT MOTION on 'fr3'?  3.61 s, peak joint speed 10% of limit</text><text class="l l11" x="18" y="266" fill="#e3b341" xml:space="preserve">    │ Force monitoring: on - aborts above 25.0 N / 5.0 N*m</text><text class="l l12" x="18" y="286" fill="#e3b341" xml:space="preserve">    └ human approves (operator=lynn)</text><text class="l l13" x="18" y="306" fill="#7ee787" xml:space="preserve">    status: "completed"    approval: "human"</text><text class="l l14" x="18" y="326" fill="#d4d4d4" xml:space="preserve"></text><text class="l l15" x="18" y="346" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; plan_to_pose(x=0.62, y=0.42, z=0.30)     # into the 'camera_mount' keep-out zone</text><text class="l l16" x="18" y="366" fill="#ff7b72" xml:space="preserve">    status: "rejected"   KEEP_OUT (hard): TCP enters keep-out zone 'camera_mount'</text><text class="l l17" x="18" y="386" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; execute_plan(36b751dac73c)               # the model tries anyway</text><text class="l l18" x="18" y="406" fill="#ff7b72" xml:space="preserve">    refused: plan violates hard safety limits and can never be executed</text><text class="l l19" x="18" y="426" fill="#d4d4d4" xml:space="preserve"></text><text class="l l20" x="18" y="446" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; estop(reason="operator saw something odd")</text><text class="l l21" x="18" y="466" fill="#ff7b72" xml:space="preserve">    estopped: true</text><text class="l l22" x="18" y="486" fill="#6cb6ff" xml:space="preserve">&gt;&gt;&gt; plan_to_pose(x=0.40, y=0.00, z=0.40)</text><text class="l l23" x="18" y="506" fill="#ff7b72" xml:space="preserve">    refused: software e-stop is active; call reset_estop (requires human approval)</text></svg>
